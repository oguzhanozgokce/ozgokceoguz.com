name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types, lint, formatting, locales, secrets
        run: npm run check

      - name: Build
        run: npm run build

      - name: Assert the site was exported
        run: |
          test -f out/index.html
          test -f out/tr/index.html
          test -f out/en/index.html
